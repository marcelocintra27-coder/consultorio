<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .botao {
            display: inline-block;
            padding: 8px 16px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
        }
        .campo {
            margin-bottom: 15px;
        }
        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .erro {
            color: #b00020;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Consultório Odontológico</h1>
        <p>{{ titulo }}</p>
    </header>

    <div class="container">
        <a href="{% url 'locacao:listar_dentistas' %}" class="botao">Voltar</a>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="campo">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="erro">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="botao">Salvar</button>
        </form>
    </div>
</body>
</html>
