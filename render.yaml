services:
  - type: web
    name: consultorio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /entrar/
    disk:
      name: consultorio-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: consultorio-db
          property: connectionString
      - key: RENDER_DISK_PATH
        value: /var/data
      # Antivírus no mesmo container, só em 127.0.0.1. Deixe 0 no plano de 512 MB.
      # O valor 1 é para o plano Standard (2 GB): o clamd carrega cerca de 1 GB
      # de assinaturas e não cabe no starter. O script de boot lê esta variável.
      - key: CLAMAV_ATIVO
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: consultorio-db
    databaseName: consultorio
    user: consultorio
    plan: 0.5c-1g
    diskSizeGB: 1
