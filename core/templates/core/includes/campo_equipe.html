<div class="campo{% if extra_class %} {{ extra_class }}{% endif %}" id="bloco-{{ field.name }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="resumo">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<div class="erro">{{ field.errors }}</div>{% endif %}
</div>
