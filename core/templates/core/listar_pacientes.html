<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pacientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #333;
            color: #fff;
        }
        .botao {
            display: inline-block;
            padding: 8px 16px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .busca-form {
            margin: 20px 0;
            display: flex;
            gap: 8px;
        }
        .busca-form input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Consultorio Odontologico</h1>
        <p>Lista de Pacientes</p>
    </header>

    <div class="container">
        <a href="{% url 'core:inicio' %}" class="botao">Voltar</a>
        <a href="{% url 'core:cadastrar_paciente' %}" class="botao">Cadastrar</a>

        <form method="get" class="busca-form">
            <input type="text" name="q" placeholder="Buscar por nome..." value="{{ termo }}">
            <button type="submit" class="botao">Buscar</button>
        </form>

        <table>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Convenio</th>
                <th></th>
            </tr>
            {% for paciente in pacientes %}
            <tr>
                <td>{{ paciente.nome_completo }}</td>
                <td>{{ paciente.telefone }}</td>
                <td>{{ paciente.convenio }}</td>
                <td>
                    <a href="{% url 'core:editar_paciente' paciente.pk %}" class="botao">Editar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhum paciente encontrado.</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
