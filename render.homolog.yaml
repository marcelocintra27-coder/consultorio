# Blueprint somente da homologação externa controlada.
# Arquivo independente. Não sincronizar este serviço com o ambiente de produção.
#
# Plano Free: sem Persistent Disk. HOMOLOG_EXTERNA_DISK_PATH aponta para /tmp,
# que é efêmero. Mídia, exames e private/SENHAS.txt somem a cada reinício,
# deploy ou hibernação; o banco continua. Aceito só porque os dados são
# fictícios. A persistência de arquivos não é homologada neste ambiente.
# Se SENHAS.txt sumir, use carregar_homolog_externa --regerar-senhas.
services:
  - type: web
    name: consultorio-homolog
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    healthCheckPath: /entrar/
    envVars:
      - key: DJANGO_ENV
        value: homologacao
      - key: DATABASE_URL
        fromDatabase:
          name: consultorio-homolog-db
          property: connectionString
      - key: HOMOLOG_EXTERNA_DISK_PATH
        value: /tmp/consultorio-homolog
      - key: SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: consultorio-homolog.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://consultorio-homolog.onrender.com

databases:
  - name: consultorio-homolog-db
    databaseName: consultorio_homolog_externa
    user: consultorio_homolog_externa
    plan: free
